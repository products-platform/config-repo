server:
  port: 8085

spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:31521/XEPDB1
    username: user_db
    password: user
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true