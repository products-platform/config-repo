server:
  port: 8761

spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000  # 2 seconds to establish connection
        response-timeout: 10s   # 10 seconds to receive response
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST

gateway:
  security:
    login: false
    customer: false
    product: false
    order: false
    payment: false
    paymentHistory: false
    inventory: false
    notification: false
    employee: false
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      orderServiceCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG