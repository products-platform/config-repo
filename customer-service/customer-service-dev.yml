server:
  port: 8083

spring:
  datasource:
    #url: jdbc:postgresql://localhost:30432/products
    url: jdbc:oracle:thin:@localhost:31521/XEPDB1
    username: customer_db
    password: customer
    #driver-class-name: org.postgresql.Driver
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true